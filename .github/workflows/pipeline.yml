name: pipeline

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Verificar la aplicacion
        run: python -c "from app.main import app"

      - name: Analizar codigo Python
        run: |
          pip install bandit==1.8.3
          bandit -r app -ll

      - name: Buscar secretos
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir imagen
        run: docker build -t consulta-tramites:${{ github.sha }} .

      - name: Escanear imagen
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: consulta-tramites:${{ github.sha }}
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true
